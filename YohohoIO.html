<!DOCTYPE html>
<html>
<head>
  <style>
    /* Simple styling for the example */
    body { font-family: sans-serif; padding: 20px; }
    iframe { border: 2px solid #333; margin-bottom: 10px; }
    button { padding: 10px 20px; cursor: pointer; font-size: 16px; }
  </style>
</head>
<body>

  <iframe 
      id="myVideo" 
      src="https://tryingtolearncoding-intermediate.github.io/YoHoHo.io/" id="myIframe" allow="fullscreen"
      width="560" 
      height="315" 
      allowfullscreen 
      allow="fullscreen">
  </iframe>

  <br>

  <button onclick="openFullscreen()">Go Fullscreen</button>

  <script>
    function openFullscreen() {
      // Get the iframe element by its ID
      var elem = document.getElementById("myVideo");

      // Standard browser method
      if (elem.requestFullscreen) {
        elem.requestFullscreen();
      } 
      // Safari / iOS support
      else if (elem.webkitRequestFullscreen) { 
        elem.webkitRequestFullscreen();
      } 
      // IE11 / older Edge support
      else if (elem.msRequestFullscreen) { 
        elem.msRequestFullscreen();
      }
    }
  </script>

</body>
</html>
